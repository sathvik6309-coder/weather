<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<style>
  :root {
    --bg-top: #4f7cff;
    --bg-bottom: #8fb8ff;
    --card-bg: rgba(255, 255, 255, 0.14);
    --card-border: rgba(255, 255, 255, 0.25);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.75);
    --accent: #ffd166;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .dashboard {
    width: 100%;
    max-width: 900px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 1.8rem;
    font-weight: 600;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
  }

  .current {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
  }

  .current-main {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .current-icon {
    font-size: 4rem;
    line-height: 1;
  }

  .current-temp {
    font-size: 3.2rem;
    font-weight: 700;
  }

  .current-desc {
    color: var(--text-dim);
    font-size: 1rem;
    margin-top: 4px;
  }

  .current-details {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 8px 24px;
    font-size: 0.92rem;
  }

  .current-details div span {
    display: block;
    color: var(--text-dim);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .forecast {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 14px;
  }

  .day-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 18px 10px;
    text-align: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .day-card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.22);
  }

  .day-card .day-name {
    font-weight: 600;
    margin-bottom: 8px;
  }

  .day-card .day-icon {
    font-size: 2.2rem;
    margin-bottom: 8px;
  }

  .day-card .day-temps {
    font-size: 0.95rem;
  }

  .day-card .temp-high {
    font-weight: 700;
  }

  .day-card .temp-low {
    color: var(--text-dim);
  }

  .day-card .day-desc {
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer {
    text-align: center;
    margin-top: 32px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  @media (max-width: 480px) {
    .current {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1 id="city-name">Loading…</h1>
      <p id="today-date"></p>
    </header>

    <section class="current" id="current-weather"></section>

    <section class="forecast" id="forecast"></section>

    <footer>Forecast data is hardcoded sample data for demo purposes.</footer>
  </div>

<script>
  const weatherData = {
    city: "San Francisco, CA",
    current: {
      temp: 68,
      description: "Partly Cloudy",
      icon: "⛅",
      feelsLike: 66,
      humidity: "62%",
      wind: "12 mph",
      uvIndex: "4 (Moderate)"
    },
    forecast: [
      { day: "Mon", icon: "☀️", high: 72, low: 58, description: "Sunny" },
      { day: "Tue", icon: "⛅", high: 68, low: 56, description: "Partly Cloudy" },
      { day: "Wed", icon: "🌧️", high: 63, low: 54, description: "Rain" },
      { day: "Thu", icon: "🌦️", high: 65, low: 55, description: "Showers" },
      { day: "Fri", icon: "☀️", high: 70, low: 57, description: "Sunny" },
      { day: "Sat", icon: "🌤️", high: 71, low: 59, description: "Mostly Sunny" },
      { day: "Sun", icon: "⛈️", high: 66, low: 56, description: "Thunderstorms" }
    ]
  };

  function renderCurrent() {
    document.getElementById("city-name").textContent = weatherData.city;
    document.getElementById("today-date").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });

    const c = weatherData.current;
    const el = document.getElementById("current-weather");
    el.innerHTML = `
      <div class="current-main">
        <div class="current-icon">${c.icon}</div>
        <div>
          <div class="current-temp">${c.temp}°F</div>
          <div class="current-desc">${c.description}</div>
        </div>
      </div>
      <div class="current-details">
        <div><span>Feels Like</span>${c.feelsLike}°F</div>
        <div><span>Humidity</span>${c.humidity}</div>
        <div><span>Wind</span>${c.wind}</div>
        <div><span>UV Index</span>${c.uvIndex}</div>
      </div>
    `;
  }

  function renderForecast() {
    const container = document.getElementById("forecast");
    container.innerHTML = weatherData.forecast.map(day => `
      <div class="day-card">
        <div class="day-name">${day.day}</div>
        <div class="day-icon">${day.icon}</div>
        <div class="day-temps">
          <span class="temp-high">${day.high}°</span>
          <span class="temp-low"> / ${day.low}°</span>
        </div>
        <div class="day-desc">${day.description}</div>
      </div>
    `).join("");
  }

  renderCurrent();
  renderForecast();
</script>
</body>
</html>
